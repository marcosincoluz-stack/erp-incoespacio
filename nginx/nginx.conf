# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION - INCOESPACIO ERP (ODOO 17)
# Basado en la arquitectura de producción y rendimiento de Incoluz
# ==============================================================================

# Definición de Upstreams para balanceo y direccionamiento interno
upstream odoo_server {
    server web:8069;
}

upstream odoo_websocket {
    server web:8072;
}

# ------------------------------------------------------------------------------
# SERVIDOR HTTP (Puerto 80): Redirección Forzada a HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name erp.incoespacio.com;

    # Desafío de validación Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirección 301 Permanente a HTTPS para todo el tráfico web
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# SERVIDOR HTTPS (Puerto 443): Proxy Seguro para Odoo 17
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name erp.incoespacio.com;

    # Rutas de Certificados SSL (Let's Encrypt / Certificados Corporativos)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Protocolos y Cifrados Criptográficos Seguros (Estándar Mozilla Modern/Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Cabeceras de Seguridad HTTP
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Tamaño máximo de subida: 100 MB (planos, catálogos, fotos de montaje, PDFs)
    client_max_body_size 100M;

    # Tiempos de espera extendidos (720s para reportes pesados y backups web)
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # Cabeceras requeridas por Odoo para proxy_mode
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # --------------------------------------------------------------------------
    # 1. Enrutamiento WebSocket (Chatter, Notificaciones en tiempo real Odoo 17)
    # --------------------------------------------------------------------------
    location /websocket {
        proxy_pass http://odoo_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --------------------------------------------------------------------------
    # 2. Caché de Elementos Estáticos (Aceleración de Navegación)
    # --------------------------------------------------------------------------
    location ~* /web/static/ {
        proxy_cache_valid 200 90m;
        proxy_buffering on;
        expires 864000;
        proxy_pass http://odoo_server;
    }

    # --------------------------------------------------------------------------
    # 3. Enrutamiento General HTTP
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://odoo_server;
        proxy_redirect off;
    }

    # --------------------------------------------------------------------------
    # 4. Compresión Gzip para Mayor Velocidad de Carga
    # --------------------------------------------------------------------------
    gzip on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_vary on;
    gzip_disable "msie6";
}
